<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MALO · Arquitectos</title>
  <meta name="description" content="MALO Arquitectos — Web en construcción. Mientras tanto, la obra sigue.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;            /* no scroll */
      overscroll-behavior: none;
      background: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .hero {
      position: relative;
      height: 100dvh;              /* pantalla completa, segura en móvil */
      width: 100vw;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;           /* vídeo a pantalla completa */
      z-index: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: clamp(16px, 4vw, 48px);
      display: flex;
      pointer-events: none;
    }

    /* Logo — arriba a la izquierda */
    .brand {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .brand .name {
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      color: #fff;
    }
    .brand .tag {
      margin-top: .5em;
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255,255,255,.85);
    }

    /* Copys — abajo a la izquierda */
    .copy {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
      max-width: min(24rem, 70vw);
    }
    .copy .line1 {
      font-size: clamp(15px, 1.8vw, 20px);
      font-weight: 600;
      color: #fff;
    }
    .copy .line2 {
      margin-top: .55em;
      font-size: clamp(13px, 1.5vw, 17px);
      font-weight: 400;
      color: rgba(255,255,255,.8);
    }

    /* Botón — abajo a la derecha */
    .contact {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .contact a {
      display: inline-block;
      pointer-events: auto;
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.7);
      padding: .75em 1.6em;
      border-radius: 999px;
      transition: background .25s ease, color .25s ease;
    }
    .contact a:hover { background: #fff; color: #000; }
    .contact a:active { background: #fff; color: #000; }
  </style>
</head>
<body>
  <main class="hero">
    <video class="bg-video" src="/video.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

    <header class="brand">
      <div class="name">MALO</div>
      <div class="tag">Arquitectos</div>
    </header>

    <section class="copy">
      <p class="line1">Web en construcción</p>
      <p class="line2">Mientras tanto, la obra sigue.</p>
    </section>

    <nav class="contact">
      <a href="mailto:hola@arquitectosmalo.com">Contacto</a>
    </nav>
  </main>

  <script>
    // Safari iPhone: asegurar autoplay aunque llegue tarde la metadata
    const v = document.querySelector('.bg-video');
    const tryPlay = () => v.play().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
    v.addEventListener('canplay', tryPlay);
    tryPlay();
  </script>
  </body>
</html>
