<head>
  <meta charset="utf-8">

  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <link rel="alternate icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <meta property="og:title" content="MALO · Arquitectos">
  <meta property="og:description" content="MALO Arquitectos — Web en construcción. Mientras tanto, la obra sigue.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;            /* no scroll */
      overscroll-behavior: none;
      background: #000;
      font-family: "Bodoni Moda", "Bodoni MT", Georgia, serif;
    }

    .hero {
      position: relative;
      height: 100dvh;              /* pantalla completa, segura en móvil */
      width: 100vw;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;           /* desktop: vídeo de fondo a pantalla completa */
      z-index: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: clamp(16px, 4vw, 48px);
      display: flex;
      pointer-events: none;
    }

    /* Logo — arriba a la izquierda */
    .brand {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .brand img {
      display: block;
      width: clamp(120px, 18vw, 220px);
      height: auto;
    }
    .brand .logo-dark { display: none; }

    /* Copys — abajo a la izquierda */
    .copy {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
      max-width: min(24rem, 70vw);
    }
    .copy .line1 {
      font-size: clamp(15px, 1.8vw, 20px);
      font-weight: 600;
      color: #fff;
    }
    .copy .line2 {
      margin-top: .55em;
      font-size: clamp(13px, 1.5vw, 17px);
      font-weight: 400;
      color: rgba(255,255,255,.8);
    }

    /* Botón — abajo a la derecha */
    .contact {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .contact a {
      display: inline-block;
      pointer-events: auto;
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.7);
      padding: .75em 1.6em;
      border-radius: 999px;
      transition: background .25s ease, color .25s ease;
    }
    .contact a:hover { background: #fff; color: #000; }
    .contact a:active { background: #fff; color: #000; }

    /* ===== Mobile: fondo blanco, vídeo 100vw proporcional, contenido oscuro ===== */
    @media (max-width: 768px) {
      html, body { background: #fff; }
      .brand .logo-light { display: none; }
      .brand .logo-dark { display: block; }
      .bg-video {
        inset: auto;
        top: 50%;
        left: 0;
        width: 100vw;
        height: auto;
        transform: translateY(-50%);
        object-fit: contain;
      }
      .brand .name { color: #111; }
      .brand .tag  { color: rgba(17,17,17,.7); }
      .brand img { width: clamp(110px, 32vw, 160px); }
      .copy .line1 { color: #111; }
      .copy .line2 { color: rgba(17,17,17,.75); }
      .contact a {
        color: #111;
        border-color: rgba(17,17,17,.7);
      }
      .contact a:hover,
      .contact a:active { background: #111; color: #fff; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <video class="bg-video" src="/video.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

    <header class="brand">
      <img class="logo-light" src="/logo-malo-blanco.png" alt="MALO Arquitectos">
      <img class="logo-dark" src="/logo-malo-negro.png" alt="MALO Arquitectos">
    </header>

    <section class="copy">
      <p class="line1">Web en construcción</p>
      <p class="line2">Mientras tanto, la obra sigue.</p>
    </section>

    <nav class="contact">
      <a href="mailto:hola@arquitectosmalo.com">Contacto</a>
    </nav>
  </main>

  <script>
    // Safari iPhone: asegurar autoplay aunque llegue tarde la metadata
    const v = document.querySelector('.bg-video');
    const tryPlay = () => v.play().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
    v.addEventListener('canplay', tryPlay);
    tryPlay();
  </script>
  </body>
</html>
