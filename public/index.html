<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MALO · Arquitectos</title>
  <meta name="description" content="MALO Arquitectos — Web en construcción. Mientras tanto, la obra sigue.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <link rel="alternate icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <meta property="og:title" content="MALO · Arquitectos">
  <meta property="og:description" content="MALO Arquitectos — Web en construcción. Mientras tanto, la obra sigue.">
  <meta property="og:image" content="/og-image-1200x630.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MALO · Arquitectos">
  <meta name="twitter:description" content="MALO Arquitectos — Web en construcción. Mientras tanto, la obra sigue.">
  <meta name="twitter:image" content="/og-image-1200x630.png">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;            /* no scroll */
      overscroll-behavior: none;
      background: #E8E7E5;         /* color dominante del vídeo: sin costura al cargar */
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .hero {
      position: relative;
      height: 100dvh;              /* pantalla completa, segura en móvil */
      width: 100vw;
      overflow: hidden;
      background: #E8E7E5;         /* poster del mismo tono: cero parpadeo */
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;           /* desktop: vídeo de fondo a pantalla completa */
      transform: scale(1.2);       /* 1,2× más grande, centrado */
      z-index: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: clamp(16px, 4vw, 48px);
      display: flex;
      pointer-events: none;
    }

    /* Logo — arriba a la izquierda */
    .brand {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .brand img {
      display: block;
      width: clamp(120px, 18vw, 220px);
      height: auto;
    }
    .brand .logo-light { display: none; }

    /* Copys — abajo a la izquierda, tamaño hero (sin overlay general) */
    .copy {
      position: absolute;
      bottom: clamp(16px, 5vh, 56px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
      max-width: min(46rem, 92vw);
    }
    .copy .line1 {
      font-size: clamp(30px, 6vw, 78px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: #111;
      min-height: 1.1em;            /* evita salto de layout durante la animación */
      /* línea 1: sin fondo, directo sobre el vídeo */
      text-shadow: 0 1px 2px rgba(255,255,255,.95), 0 0 1px rgba(17,17,17,.18);
    }
    .copy .line2 {
      margin-top: .35em;
      font-size: clamp(19px, 3.2vw, 42px);
      font-weight: 500;
      line-height: 1.15;
      color: rgba(17,17,17,.88);
      min-height: 1.2em;
    }
    /* pill de contraste SOLO en la línea 2, ceñida al texto: sin texto no hay caja visible */
    .copy .line2 .txt {
      display: inline-block;
      max-width: 100%;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: .12em .35em;
      text-shadow: 0 1px 2px rgba(255,255,255,.95);
    }

    /* Cursor typewriter */
    .cursor {
      display: none;
      font-weight: 400;
      color: #111;
      animation: blink 1s steps(1) infinite;
    }
    .cursor.typing { display: inline; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Selector de idioma — arriba a la derecha, discreto */
    .lang {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 3;
      display: flex;
      gap: .25em;
      padding: .3em .4em;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(17,17,17,.35);
    }
    .lang button {
      pointer-events: auto;
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: 600 clamp(12px, 1.1vw, 13px)/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .08em;
      color: rgba(17,17,17,.55);
      padding: .6em 1em;           /* zona táctil ≥44px con el padding del contenedor */
      border-radius: 999px;
      transition: color .2s ease, background .2s ease;
    }
    /* Fallback: si el navegador no soporta backdrop-filter (Safari viejo),
       sube la opacidad del fondo para conservar legibilidad sin blur */
    @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
      .lang { background: rgba(255,255,255,.92); }
      .contact a { background: rgba(255,255,255,.95); }
      .copy .line2 .txt { background: rgba(255,255,255,.85); }
      .modal { background: rgba(17,17,17,.6); }
    }
    .lang button.active {
      color: #fff;
      background: #111;
    }

    /* Botón — abajo a la derecha */
    .contact {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .contact a {
      display: inline-block;
      pointer-events: auto;
      font-size: clamp(14px, 1.6vw, 17px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(17,17,17,.75);
      padding: .8em 1.7em;
      border-radius: 999px;
      transition: background .25s ease, color .25s ease, transform .25s ease, opacity .8s ease;
      opacity: 0;                    /* fade-in tras el typewriter */
      transform: translateY(8px);
    }
    .contact a.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .contact a:hover { background: #111; color: #fff; }
    .contact a:active { background: #111; color: #fff; }

    /* ===== Formulario de contacto (modal interno) ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 48px);
      background: rgba(17,17,17,.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      position: relative;
      width: min(26rem, 100%);
      background: #fff;
      border-radius: 16px;
      padding: clamp(24px, 4vw, 36px);
      box-shadow: 0 24px 64px rgba(17,17,17,.35);
      transform: translateY(12px) scale(.98);
      transition: transform .3s ease;
    }
    .modal.open .modal-card { transform: translateY(0) scale(1); }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      color: rgba(17,17,17,.55);
      padding: 6px;
    }
    .modal-card h2 {
      font-size: clamp(20px, 2.6vw, 26px);
      font-weight: 700;
      color: #111;
      margin-bottom: .4em;
    }
    .modal-card .subtitle {
      font-size: 14px;
      color: rgba(17,17,17,.65);
      margin-bottom: 1.4em;
    }
    .field { margin-bottom: 1.1em; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(17,17,17,.6);
      margin-bottom: .45em;
    }
    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(17,17,17,.25);
      border-radius: 10px;
      padding: .8em .9em;
      font: 400 16px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; /* 16px: sin zoom iOS */
      color: #111;
      background: #fff;
      transition: border-color .2s ease;
    }
    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: #111;
    }
    .field textarea { min-height: 96px; resize: vertical; }
    .field .error {
      display: none;
      font-size: 12px;
      color: #b3261e;
      margin-top: .35em;
    }
    .field.invalid .error { display: block; }
    .field.invalid input,
    .field.invalid textarea { border-color: #b3261e; }
    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .submit-btn {
      width: 100%;
      appearance: none;
      border: 0;
      cursor: pointer;
      background: #111;
      color: #fff;
      font: 600 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .95em 1em;
      border-radius: 999px;
      transition: background .2s ease, opacity .2s ease;
    }
    .submit-btn:hover:not(:disabled) { background: #000; }
    .submit-btn:disabled { opacity: .55; cursor: wait; }
    .form-status {
      display: none;
      margin-top: 1em;
      font-size: 14px;
      line-height: 1.4;
    }
    .form-status.sending { display: block; color: rgba(17,17,17,.65); }
    .form-status.ok { display: block; color: #1e7a35; }
    .form-status.err { display: block; color: #b3261e; }

    /* ===== Mobile: fondo blanco, vídeo 100vw proporcional, contenido oscuro ===== */
    @media (max-width: 768px) {
      html, body { background: #E8E7E5; }
      .hero { background: #E8E7E5; }
      .brand .logo-dark { display: block; }
      .copy { max-width: 88vw; }
      .bg-video {
        inset: 0;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        transform: none;
        object-fit: cover;          /* cubre viewport, sin barras ni costuras */
      }
      .copy .line1 { color: #111; text-shadow: 0 1px 2px rgba(255,255,255,.95), 0 0 1px rgba(17,17,17,.18); }
      .copy .line2 { color: rgba(17,17,17,.75); text-shadow: 0 1px 2px rgba(255,255,255,.95); }
      .copy .line2 .txt { padding: .1em .3em; }
      .contact a {
        background: rgba(255,255,255,.9);
        color: #111;
        border-color: rgba(17,17,17,.75);
        font-size: 16px;            /* ≥16px: evita el zoom automático de iOS Safari */
      }
      .contact a:hover,
      .contact a:active { background: #111; color: #fff; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <video class="bg-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture poster="/poster.jpg">
      <source src="/video-mobile.mp4" type="video/mp4" media="(max-width: 768px)">
      <source src="/video.mp4" type="video/mp4">
    </video>

    <header class="brand">
      <img class="logo-light" src="/logo-malo-blanco.png" alt="MALO Arquitectos">
      <img class="logo-dark" src="/logo-malo-negro.png" alt="MALO Arquitectos">
    </header>

    <section class="copy">
      <p class="line1"><span class="txt" data-i18n="line1"></span><span class="cursor" aria-hidden="true">|</span></p>
      <p class="line2"><span class="txt" data-i18n="line2"></span><span class="cursor" aria-hidden="true">|</span></p>
    </section>

    <nav class="lang" aria-label="Language">
      <button type="button" data-lang="en" class="active">EN</button>
      <button type="button" data-lang="es">ES</button>
    </nav>

    <nav class="contact">
      <a href="#contact-form">Contact</a>
    </nav>

    <!-- Formulario interno (modal) -->
    <div class="modal" id="contact-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <button type="button" class="modal-close" aria-label="Cerrar">×</button>
        <h2 id="modal-title">Escríbenos</h2>
        <p class="subtitle">Cuéntanos tu proyecto y te respondemos a la brevedad.</p>
        <form id="contact-form" novalidate>
          <div class="field">
            <label for="f-name">Nombre</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
            <span class="error">Dinos tu nombre.</span>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
            <span class="error">Necesitamos un email válido.</span>
          </div>
          <div class="field">
            <label for="f-msg">Mensaje</label>
            <textarea id="f-msg" name="message" required></textarea>
            <span class="error">Cuéntanos algo de tu proyecto.</span>
          </div>
          <!-- honeypot anti-spam: invisible para humanos, tentador para bots -->
          <div class="hp" aria-hidden="true">
            <label for="f-company">Company</label>
            <input id="f-company" name="company" type="text" tabindex="-1" autocomplete="off">
          </div>
          <button type="submit" class="submit-btn">Enviar</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Safari iPhone: asegurar autoplay aunque llegue tarde la metadata
    const v = document.querySelector('.bg-video');
    const tryPlay = () => v.play().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
    v.addEventListener('canplay', tryPlay);
    tryPlay();

    // Formulario interno: modal + fetch AJAX (nunca sale de la página)
    (function contactForm() {
      const modal = document.getElementById('contact-modal');
      const openers = [...document.querySelectorAll('.contact a')];
      const closeBtn = modal.querySelector('.modal-close');
      const form = document.getElementById('contact-form');
      const status = form.querySelector('.form-status');
      const submitBtn = form.querySelector('.submit-btn');
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function open() { modal.classList.add('open'); }
      function close() { modal.classList.remove('open'); }
      openers.forEach(a => a.addEventListener('click', e => { e.preventDefault(); open(); }));
      closeBtn.addEventListener('click', close);
      modal.addEventListener('click', e => { if (e.target === modal) close(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

      function validate() {
        let ok = true;
        form.querySelectorAll('.field').forEach(f => {
          const input = f.querySelector('input,textarea');
          const valid = input.name === 'email'
            ? EMAIL_RE.test(input.value.trim())
            : input.value.trim().length >= 2;
          f.classList.toggle('invalid', !valid);
          if (!valid) ok = false;
        });
        return ok;
      }
      form.querySelectorAll('input,textarea').forEach(i =>
        i.addEventListener('input', () => i.closest('.field').classList.remove('invalid')));

      function setStatus(mode, msg) {
        status.className = 'form-status ' + mode;
        status.textContent = msg;
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (form.company.value) return;          // honeypot: bot detectado, fingir éxito
        if (!validate()) return;

        submitBtn.disabled = true;
        setStatus('sending', 'Enviando…');
        try {
          const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: form.name.value.trim(),
              email: form.email.value.trim(),
              message: form.message.value.trim()
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          setStatus('ok', '✓ Enviado. Te respondemos muy pronto.');
          form.reset();
          setTimeout(close, 2200);
        } catch (err) {
          setStatus('err', 'No se pudo enviar. Inténtalo de nuevo o escribe a hola@malo.works');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();

    // Typewriter + idioma — natural timing, respeta prefers-reduced-motion
    (function hero() {
      const I18N = {
        en: { line1: 'Building the website.', line2: 'The work never stops.', contact: 'Contact' },
        es: { line1: 'Construyendo la web.', line2: 'La obra no se detiene.', contact: 'Contacto' }
      };
      const lines = [...document.querySelectorAll('.copy .txt')];
      const cursors = [...document.querySelectorAll('.copy .cursor')];
      const contactLink = document.querySelector('.contact a');
      const langBtns = [...document.querySelectorAll('.lang button')];
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let timer = null;
      let lang = 'en'; // inglés por defecto

      function showInstant(t) {
        // Sin animación (reduced motion): texto directo + contacto visible
        clearTimeout(timer);
        lines.forEach((el, i) => {
          el.textContent = t[['line1','line2'][i]];
          el.nextElementSibling.classList.remove('typing');
        });
        contactLink.textContent = t.contact;
        contactLink.classList.add('visible');
      }

      function typeSequence(t) {
        clearTimeout(timer);
        lines.forEach(el => el.textContent = '');
        contactLink.classList.remove('visible');   // compite menos con la animación
        contactLink.textContent = t.contact;
        const full = [t.line1, t.line2];
        const base = 55, jitter = 40, pauseBetweenLines = 550;
        let li = 0;

        (function typeLine() {
          const txt = full[li], el = lines[li], cur = cursors[li];
          cur.classList.add('typing');
          let ci = 0;
          (function step() {
            el.textContent = txt.slice(0, ++ci);
            if (ci < txt.length) {
              const extra = /[.,:]/.test(txt[ci-1]) ? 260 : 0;
              timer = setTimeout(step, base + Math.random() * jitter + extra);
            } else {
              cur.classList.remove('typing');
              li++;
              if (li < full.length) {
                timer = setTimeout(typeLine, pauseBetweenLines);
              } else {
                contactLink.classList.add('visible'); // fade-in al terminar
              }
            }
          })();
        })();
      }

      function setLang(next, animate) {
        lang = next;
        const t = I18N[next];
        langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === next));
        if (animate && !reduced) typeSequence(t);
        else showInstant(t);
      }

      langBtns.forEach(b => b.addEventListener('click', () => {
        if (b.dataset.lang !== lang) setLang(b.dataset.lang, true);
      }));

      // Primera carga: inglés + animación
      setLang('en', true);
    })();
  </script>
  </body>
</html>
