  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;            /* no scroll */
      overscroll-behavior: none;
      background: #000;
      font-family: "Bodoni Moda", "Bodoni MT", Georgia, serif;
    }

    .hero {
      position: relative;
      height: 100dvh;              /* pantalla completa, segura en móvil */
      width: 100vw;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;           /* desktop: vídeo de fondo a pantalla completa */
      transform: scale(1.2);       /* 1,2× más grande, centrado */
      z-index: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: clamp(16px, 4vw, 48px);
      display: flex;
      pointer-events: none;
    }

    /* Logo — arriba a la izquierda */
    .brand {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .brand img {
      display: block;
      width: clamp(120px, 18vw, 220px);
      height: auto;
    }
    .brand .logo-light { display: none; }

    /* Copys — abajo a la izquierda, tamaño hero */
    .copy {
      position: absolute;
      bottom: clamp(16px, 5vh, 56px);
      left: clamp(16px, 4vw, 48px);
      z-index: 2;
      max-width: min(46rem, 92vw);
    }
    .copy .line1 {
      font-size: clamp(30px, 6vw, 78px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: #111;
      min-height: 1.1em;            /* evita salto de layout durante la animación */
      text-shadow: 0 2px 6px rgba(255,255,255,.8), 0 0 22px rgba(255,255,255,.7);
    }
    .copy .line2 {
      margin-top: .35em;
      font-size: clamp(19px, 3.2vw, 42px);
      font-weight: 500;
      line-height: 1.15;
      color: rgba(17,17,17,.82);
      min-height: 1.2em;
      text-shadow: 0 2px 6px rgba(255,255,255,.8), 0 0 22px rgba(255,255,255,.7);
    }

    /* Cursor typewriter */
    .cursor {
      display: none;
      font-weight: 400;
      color: #111;
      animation: blink 1s steps(1) infinite;
    }
    .cursor.typing { display: inline; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Selector de idioma — arriba a la derecha, discreto */
    .lang {
      position: absolute;
      top: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 3;
      display: flex;
      gap: .25em;
      padding: .3em .4em;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(17,17,17,.35);
    }
    .lang button {
      pointer-events: auto;
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: 600 clamp(11px, 1.1vw, 13px)/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .08em;
      color: rgba(17,17,17,.55);
      padding: .45em .8em;
      border-radius: 999px;
      transition: color .2s ease, background .2s ease;
    }
    .lang button.active {
      color: #fff;
      background: #111;
    }

    /* Botón — abajo a la derecha */
    .contact {
      position: absolute;
      bottom: clamp(16px, 4vw, 48px);
      right: clamp(16px, 4vw, 48px);
      z-index: 2;
    }
    .contact a {
      display: inline-block;
      pointer-events: auto;
      font-size: clamp(14px, 1.6vw, 17px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #111;
      text-decoration: none;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(17,17,17,.75);
      padding: .8em 1.7em;
      border-radius: 999px;
      transition: background .25s ease, color .25s ease, transform .25s ease, opacity .8s ease;
      opacity: 0;                    /* fade-in tras el typewriter */
      transform: translateY(8px);
    }
    .contact a.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .contact a:hover { background: #111; color: #fff; }
    .contact a:active { background: #111; color: #fff; }

    /* ===== Mobile: fondo blanco, vídeo 100vw proporcional, contenido oscuro ===== */
    @media (max-width: 768px) {
      html, body { background: #fff; }
      .brand .logo-dark { display: block; }
      .copy { max-width: 88vw; }
      .bg-video {
        inset: auto;
        top: 50%;
        left: 0;
        width: 100vw;
        height: auto;
        transform: translateY(-50%) scale(1.2); /* 1,2× más grande, centrado */
        object-fit: contain;
      }
      .copy .line1 { color: #111; text-shadow: none; }
      .copy .line2 { color: rgba(17,17,17,.75); text-shadow: none; }
      .contact a {
        background: rgba(255,255,255,.9);
        color: #111;
        border-color: rgba(17,17,17,.75);
      }
      .contact a:hover,
      .contact a:active { background: #111; color: #fff; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <video class="bg-video" src="/video.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

    <header class="brand">
      <img class="logo-light" src="/logo-malo-blanco.png" alt="MALO Arquitectos">
      <img class="logo-dark" src="/logo-malo-negro.png" alt="MALO Arquitectos">
    </header>

    <section class="copy">
      <p class="line1"><span class="txt" data-i18n="line1"></span><span class="cursor" aria-hidden="true">|</span></p>
      <p class="line2"><span class="txt" data-i18n="line2"></span><span class="cursor" aria-hidden="true">|</span></p>
    </section>

    <nav class="lang" aria-label="Language">
      <button type="button" data-lang="en" class="active">EN</button>
      <button type="button" data-lang="es">ES</button>
    </nav>

    <nav class="contact">
      <a href="mailto:hola@arquitectosmalo.com">Contacto</a>
    </nav>
  </main>

  <script>
    // Safari iPhone: asegurar autoplay aunque llegue tarde la metadata
    const v = document.querySelector('.bg-video');
    const tryPlay = () => v.play().catch(()=>{});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tryPlay(); });
    v.addEventListener('canplay', tryPlay);
    tryPlay();

    // Typewriter + idioma — natural timing, respeta prefers-reduced-motion
    (function hero() {
      const I18N = {
        en: { line1: 'Building the website.', line2: 'The work never stops.', contact: 'Contact' },
        es: { line1: 'Construyendo la web.', line2: 'La obra no se detiene.', contact: 'Contacto' }
      };
      const lines = [...document.querySelectorAll('.copy .txt')];
      const cursors = [...document.querySelectorAll('.copy .cursor')];
      const contactLink = document.querySelector('.contact a');
      const langBtns = [...document.querySelectorAll('.lang button')];
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let timer = null;
      let lang = 'en'; // inglés por defecto

      function showInstant(t) {
        // Sin animación (reduced motion): texto directo + contacto visible
        clearTimeout(timer);
        lines.forEach((el, i) => {
          el.textContent = t[['line1','line2'][i]];
          el.nextElementSibling.classList.remove('typing');
        });
        contactLink.textContent = t.contact;
        contactLink.classList.add('visible');
      }

      function typeSequence(t) {
        clearTimeout(timer);
        lines.forEach(el => el.textContent = '');
        contactLink.classList.remove('visible');   // compite menos con la animación
        contactLink.textContent = t.contact;
        const full = [t.line1, t.line2];
        const base = 55, jitter = 40, pauseBetweenLines = 550;
        let li = 0;

        (function typeLine() {
          const txt = full[li], el = lines[li], cur = cursors[li];
          cur.classList.add('typing');
          let ci = 0;
          (function step() {
            el.textContent = txt.slice(0, ++ci);
            if (ci < txt.length) {
              const extra = /[.,:]/.test(txt[ci-1]) ? 260 : 0;
              timer = setTimeout(step, base + Math.random() * jitter + extra);
            } else {
              cur.classList.remove('typing');
              li++;
              if (li < full.length) {
                timer = setTimeout(typeLine, pauseBetweenLines);
              } else {
                contactLink.classList.add('visible'); // fade-in al terminar
              }
            }
          })();
        })();
      }

      function setLang(next, animate) {
        lang = next;
        const t = I18N[next];
        langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === next));
        if (animate && !reduced) typeSequence(t);
        else showInstant(t);
      }

      langBtns.forEach(b => b.addEventListener('click', () => {
        if (b.dataset.lang !== lang) setLang(b.dataset.lang, true);
      }));

      // Primera carga: inglés + animación
      setLang('en', true);
    })();
  </script>
  </body>
</html>
